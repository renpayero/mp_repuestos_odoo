[options]
; ============================================================================
;  PLANTILLA de configuración. El bootstrap genera /etc/odoo/odoo.conf
;  a partir de este archivo, inyectando los secretos con envsubst:
;    $ODOO_MASTER_PASSWD  $POSTGRES_USER  $POSTGRES_PASSWORD  $DB_NAME
;  El resto del archivo NO debe usar la sintaxis $VAR (Odoo no la interpola).
; ============================================================================

; --- Gestión de bases (master password, NO es el login del usuario admin) ---
admin_passwd = $ODOO_MASTER_PASSWD
list_db = False
dbfilter = ^$DB_NAME$

; --- Conexión a PostgreSQL ---
db_host = db
db_port = 5432
db_user = $POSTGRES_USER
db_password = $POSTGRES_PASSWORD

; --- Addons: cada repo de terceros es un directorio con N módulos adentro ---
addons_path = /mnt/extra-addons/external/odoo-argentina-ce,/mnt/extra-addons/external/odoo-argentina,/mnt/extra-addons/external/account-payment,/mnt/extra-addons/external/account-financial-tools,/mnt/extra-addons/external/reporting-engine,/mnt/extra-addons/custom

; --- Reverse proxy (NGINX Proxy Manager existente) ---
proxy_mode = True
gevent_port = 8072

; --- Workers (1 caja PoS) ---
workers = 3
max_cron_threads = 1

; --- Límites de memoria/tiempo ---
limit_memory_soft = 1342177280
limit_memory_hard = 1610612736
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

; --- Localización (idioma por defecto al inicializar/instalar) ---
load_language = es_AR

data_dir = /var/lib/odoo
